# docker compose up -d --wait

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/webframework?serverTimezone=Asia/Seoul&characterEncording=UTF-8}
    username: ${DB_USERNAME:webframework}
    password: ${DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
